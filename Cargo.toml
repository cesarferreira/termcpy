[package]
name = "termcpy"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Mirror and control Android devices in your terminal"
license = "MIT"
authors = ["Cesar Ferreira"]
repository = "https://github.com/cesarferreira/termcpy"

[[bin]]
name = "termcpy"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
flate2 = "1"
libc = "0.2"
signal-hook = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
